<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini CMS Dashboard</title>
    <!-- Link Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Menu Navigasi -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Mini CMS - Psikotest Sharing Vision - Ghazi Mifzal Aufa</a>
            <div class="navbar-nav">
                <!-- Kita pakai onclick untuk memanggil fungsi pindah halaman -->
                <a class="nav-link active" id="nav-all-posts" href="#" onclick="switchPage('all-posts')">All Posts</a>
                <a class="nav-link" id="nav-add-new" href="#" onclick="switchPage('add-new')">Add New</a>
                <a class="nav-link" id="nav-preview" href="#" onclick="switchPage('preview')">Preview</a>
            </div>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- HALAMAN 1: ALL POSTS -->
    <!-- ========================================== -->
    <div id="page-all-posts" class="container bg-white p-4 rounded shadow-sm">
        <h3 class="mb-4">All Posts</h3>
        
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#published" type="button">Published</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#drafts" type="button">Drafts</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#trashed" type="button">Trashed</button>
            </li>
        </ul>

        <div class="tab-content border border-top-0 p-3" id="myTabContent">
            <!-- Tab Published -->
            <div class="tab-pane fade show active" id="published">
                <table class="table table-hover mt-2">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 60px;">No.</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data akan diisi oleh JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <!-- Tab Drafts -->
            <div class="tab-pane fade" id="drafts"></div>

            <!-- Tab Trashed -->
            <div class="tab-pane fade" id="trashed"></div>
        </div>
    </div>

<!-- ========================================== -->
    <!-- HALAMAN 2: ADD NEW (Awalnya Disembunyikan pakai d-none) -->
    <!-- ========================================== -->
    <div id="page-add-new" class="container bg-white p-4 rounded shadow-sm d-none" style="max-width: 800px;">
        <h3 class="mb-4">Add New Post</h3>
        
        <form>
            <div class="mb-3">
                <label for="postTitle" class="form-label fw-bold">Title</label>
                <input type="text" class="form-control" id="postTitle" placeholder="Masukkan judul artikel">
            </div>

            <div class="mb-3">
                <label for="postCategory" class="form-label fw-bold">Category</label>
                <select class="form-select" id="postCategory">
                    <option value="" disabled selected>Pilih Kategori...</option>
                    <option value="Technology">Technology</option>
                    <option value="Sports">Sports</option>
                    <option value="Gaming">Gaming</option>
                    <option value="Electronic">Electronic</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Business">Business</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Automotive">Automotive</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="postContent" class="form-label fw-bold">Content</label>
                <textarea class="form-control" id="postContent" rows="6" placeholder="Tulis isi artikel..."></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="button" class="btn btn-primary px-4" onclick="saveNewArticle('Published')">Publish</button>
                <button type="button" class="btn btn-secondary px-4" onclick="saveNewArticle('Draft')">Draft</button>
            </div>
        </form>
    </div>

    <!-- ========================================== -->
    <!-- HALAMAN 3: PREVIEW (Awalnya Disembunyikan pakai d-none) -->
    <!-- ========================================== -->
    <div id="page-preview" class="container d-none" style="max-width: 800px;">
        <h2 class="mb-4 text-center">Blog Preview</h2>
        <div id="blogContainer">
            <!-- Data akan diisi oleh JavaScript nanti -->
            <p class="text-center text-muted">Belum ada artikel yang dipublish.</p>
        </div>
    </div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>

<!-- ========================================== -->
    <!-- HALAMAN 4: EDIT ARTICLE (Poin 1b) -->
    <!-- ========================================== -->
    <div id="page-edit" class="container bg-white p-4 rounded shadow-sm d-none" style="max-width: 800px;">
        <h3 class="mb-4">Edit Article</h3>
        
        <form>
            <!-- ID Tersembunyi untuk melacak artikel yang diedit -->
            <input type="hidden" id="editArticleId">

            <div class="mb-3">
                <label for="editTitle" class="form-label fw-bold">Title</label>
                <input type="text" class="form-control" id="editTitle">
            </div>

            <div class="mb-3">
                <label for="editCategory" class="form-label fw-bold">Category</label>
                <select class="form-select" id="editCategory">
                    <option value="" disabled selected>Pilih Kategori...</option>
                    <option value="Teknologi">Teknologi</option>
                    <option value="Sports">Sports</option>
                    <option value="Gaming">Gaming</option>
                    <option value="Electronic">Electronic</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Business">Business</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Automotive">Automotive</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="editContent" class="form-label fw-bold">Content</label>
                <textarea class="form-control" id="editContent" rows="6"></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="button" class="btn btn-primary px-4" onclick="saveEditedArticle('Published')">Publish</button>
                <button type="button" class="btn btn-secondary px-4" onclick="saveEditedArticle('Draft')">Draft</button>
                <button type="button" class="btn btn-outline-secondary px-4" onclick="switchPage('all-posts')">Cancel</button>
            </div>
        </form>
    </div>
