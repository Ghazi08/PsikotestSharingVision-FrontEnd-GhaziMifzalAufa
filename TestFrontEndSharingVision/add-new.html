<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Add New</title>
    <!-- Link Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Menu Navigasi -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Mini CMS</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">All Posts</a>
                <a class="nav-link active" href="add-new.html">Add New</a>
                <a class="nav-link" href="preview.html">Preview</a>
            </div>
        </div>
    </nav>

    <!-- Konten Utama: Form -->
    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 800px;">
        <h3 class="mb-4">Add New Post</h3>
        
        <form>
            <div class="mb-3">
                <label for="postTitle" class="form-label fw-bold">Title</label>
                <input type="text" class="form-control" id="postTitle" placeholder="Masukkan judul artikel">
            </div>

            <!-- KATEGORI DIUBAH JADI DROPDOWN -->
            <div class="mb-3">
                <label for="postCategory" class="form-label fw-bold">Category</label>
                <select class="form-select" id="postCategory">
                    <option value="" disabled selected>Pilih Kategori...</option>
                    <option value="Technology">Technology</option>
                    <option value="Sports">Sports</option>
                    <option value="Gaming">Gaming</option>
                    <option value="Electronic">Electronic</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Business">Business</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Automotive">Automotive</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="postContent" class="form-label fw-bold">Content</label>
                <textarea class="form-control" id="postContent" rows="6" placeholder="Tulis isi artikel..."></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="button" class="btn btn-primary px-4" onclick="saveNewArticle('Published')">Publish</button>
                <button type="button" class="btn btn-secondary px-4" onclick="saveNewArticle('Draft')">Draft</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
